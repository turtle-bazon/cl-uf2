name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: build inside the old-glibc SBCL image so the binary runs
          # on older distributions (glibc is only forward-compatible).
          - os: ubuntu-latest
            container: ghcr.io/turtle-bazon/sbcl-bullseye-build/sbcl-bullseye:latest
            artifact: uf2-linux-x86_64
          - os: macos-latest
            artifact: uf2-macos
          - os: windows-latest
            artifact: uf2-windows-x86_64
    steps:
      - name: Install git (Linux container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Install SBCL (Windows)
        if: runner.os == 'Windows'
        run: choco install sbcl -y --no-progress

      - name: Set up Quicklisp
        shell: bash
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o "$RUNNER_TEMP/quicklisp.lisp"
          sbcl --non-interactive --load "$RUNNER_TEMP/quicklisp.lisp" \
            --eval '(quicklisp-quickstart:install)'
          echo '(load "~/quicklisp/setup.lisp")' >> "$HOME/.sbclrc"
          # Make ASDF find the project's .asd files in the checkout directory.
          echo "(push '*default-pathname-defaults* asdf:*central-registry*)" >> "$HOME/.sbclrc"

      - name: Build
        shell: bash
        run: sbcl --non-interactive --load build.lisp

      - name: Test
        shell: bash
        run: |
          sbcl --non-interactive \
            --eval '(ql:quickload "cl-uf2-tests")' \
            --eval '(unless (cl-uf2-tests:run-tests) (uiop:quit 1))'

      - name: Check glibc floor (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "required GLIBC: $(objdump -T build/uf2 | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq | tail -1)"
          ldd build/uf2

      - name: Smoke test
        shell: bash
        run: |
          BIN=build/uf2
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=build/uf2.exe
          fi
          "$BIN" --version
          "$BIN" conv -a 0x2000 -i 0xADA52840 cl-uf2.asd "$RUNNER_TEMP/smoke.uf2"
          "$BIN" conv -d "$RUNNER_TEMP/smoke.uf2" "$RUNNER_TEMP/smoke.bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/uf2*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: uf2-linux-x86_64
          path: linux

      - name: Download macOS binary
        uses: actions/download-artifact@v4
        with:
          name: uf2-macos
          path: macos

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: uf2-windows-x86_64
          path: windows

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          find linux   -type f -name 'uf2*' -exec cp {} release-assets/uf2-linux-x86_64 \;
          find macos   -type f -name 'uf2*' -exec cp {} release-assets/uf2-macos \;
          find windows -type f -name 'uf2*' -exec cp {} release-assets/uf2-windows-x86_64.exe \;
          ls -laR release-assets
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "cl-uf2 $TAG" \
              --notes "Built by CI from tag $TAG."
          fi
